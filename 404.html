<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material en construcció</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      text-align: center; 
      padding: 50px 20px; 
      background: #f8fafc; 
      color: #1e293b;
    }
    .card { 
      background: white; 
      padding: 40px 30px; 
      border-radius: 16px; 
      display: inline-block; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); 
      border: 1px solid #e2e8f0;
      max-width: 450px;
      width: 100%;
    }
    h1 { color: #e67e22; margin-bottom: 12px; font-size: 1.8rem; }
    p { color: #64748b; font-size: 1rem; margin-bottom: 24px; }
    .btn { 
      display: inline-block; 
      background-color: #0284c7; 
      color: white; 
      padding: 10px 20px; 
      border-radius: 8px; 
      text-decoration: none; 
      font-weight: 600; 
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚧 Material en construcció</h1>
    <p>Aquest document encara no està disponible o s'està actualitzant.</p>
    <!-- L'enllaç ara apunta a la ruta relativa correcta del repositori /mates/ -->
    <a href="/mates/" class="btn">⬅️ Tornar a la pàgina principal</a>
  </div>
</body>
</html>
