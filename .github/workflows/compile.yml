      # ==========================================
      # COPIAR TOTS ELS PDFS GENERATS A LA WEB
      # ==========================================
      - name: Organitzar PDFs i Web
        run: |
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT; do
            for i in {1..10}; do
              # Si hi ha main.pdf (Apunts)
              cp $curs/Tema$i/main.pdf public/$curs/Tema${i}_apunts.pdf 2>/dev/null || true
              # Si hi ha exercicis.pdf
              cp $curs/Tema$i/exercicis.pdf public/$curs/Tema${i}_exercicis.pdf 2>/dev/null || true
            done
          done
          cp index.html public/

      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
