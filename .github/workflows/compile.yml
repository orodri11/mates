name: Compilar LaTeX i Publicar Web

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el repositori
        uses: actions/checkout@v4

      - name: Crear directoris public
        run: |
          mkdir -p public/1BATX_MACS public/1BATX_CCTT public/2BATX_MACS public/2BATX_CCTT public/PAU public/PAP

      # COMPILACIÓ DE TOTS ELS FITXERS .TEX
      - name: Compilar TOTS els fitxers .tex
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-lang-spanish texlive-fonts-recommended python3

          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            for i in {0..10}; do
              dir="$curs/Tema$i"
              if [ -d "$dir" ]; then
                for tex_file in "$dir"/*.tex; do
                  if [ -f "$tex_file" ]; then
                    echo "⚙️ Compilant $tex_file..."
                    pdflatex -interaction=nonstopmode -output-directory="$dir" "$tex_file" || true
                  fi
                done
              fi
            done
          done

      # ORGANITZAR PDFs I GENERAR ÍNDEX D'ARXIUS (files.json)
      - name: Organitzar PDFs i crear manifest de fitxers
        run: |
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            # Copiar PDFs directes de l'arrel del curs
            cp $curs/*.pdf public/$curs/ 2>/dev/null || true

            for i in {0..10}; do
              dir="$curs/Tema$i"
              if [ -d "$dir" ]; then
                # Copiar Apunts
                [ -f "$dir/main.pdf" ] && cp "$dir/main.pdf" "public/$curs/Tema${i}_apunts.pdf"
                
                # Copiar Exercicis / Solucions generals
                [ -f "$dir/exercicis.pdf" ] && cp "$dir/exercicis.pdf" "public/$curs/Tema${i}_exercicis.pdf"
                [ -f "$dir/solucions.pdf" ] && cp "$dir/solucions.pdf" "public/$curs/Tema${i}_solucions.pdf"

                # Copiar qualsevol ex*.pdf o sol*.pdf (mantenint el títol si en té, ex: ex1_Intervals.pdf -> Tema1_ex1_Intervals.pdf)
                for f in "$dir"/ex*.pdf "$dir"/sol*.pdf; do
                  if [ -f "$f" ]; then
                    fname=$(basename "$f")
                    cp "$f" "public/$curs/Tema${i}_${fname}"
                  fi
                done
              fi
            done

            # Generar el fitxer JSON amb la llista real de PDFs d'aquest curs
            python3 -c "
import os, json
path = 'public/$curs'
files = [f for f in os.listdir(path) if f.endswith('.pdf')] if os.path.exists(path) else []
with open(os.path.join(path, 'files.json'), 'w') as f:
    json.dump(files, f)
"
          done
          
          cp index.html public/

      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
