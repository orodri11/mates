name: Compilar LaTeX i Publicar Web

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el repositori
        uses: actions/checkout@v4

      - name: Crear directoris public
        run: |
          mkdir -p public/1BATX_MACS public/1BATX_CCTT public/2BATX_MACS public/2BATX_CCTT public/PAU public/PAP

      # -----------------------------------------------------------------
      # COMPILACIÓ DINÀMICA DE TOTS ELS FITXERS LATEX EXISTENTS
      # -----------------------------------------------------------------
      - name: Compilar tots els fitxers main.tex i exercicis.tex
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-lang-spanish texlive-fonts-recommended

          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            # Bucle ajustat de 0 a 10 per incloure el Tema 0
            for i in {0..10}; do
              dir="$curs/Tema$i"
              if [ -d "$dir" ]; then
                echo "🔍 Revisant directori: $dir"
                
                # Compilar apunts (main.tex)
                if [ -f "$dir/main.tex" ]; then
                  echo "⚙️ Compilant $dir/main.tex..."
                  pdflatex -interaction=nonstopmode -output-directory="$dir" "$dir/main.tex" || true
                fi

                # Compilar exercicis (exercicis.tex)
                if [ -f "$dir/exercicis.tex" ]; then
                  echo "⚙️ Compilant $dir/exercicis.tex..."
                  pdflatex -interaction=nonstopmode -output-directory="$dir" "$dir/exercicis.tex" || true
                fi
              fi
            done
          done

      # -----------------------------------------------------------------
      # ORGANITZAR PDFS PER A GITHUB PAGES
      # -----------------------------------------------------------------
      - name: Organitzar PDFs i copiar a public
        run: |
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            # 1. Copiar PDFs pujats directament a l'arrel de la carpeta del curs (ex: 1BATX_CCTT/Tema0_apunts.pdf)
            cp $curs/*.pdf public/$curs/ 2>/dev/null || true

            # 2. Copiar PDFs compilats des de subcarpetes (ex: 1BATX_CCTT/Tema0/main.pdf)
            for i in {0..10}; do
              if [ -f "$curs/Tema$i/main.pdf" ]; then
                cp "$curs/Tema$i/main.pdf" "public/$curs/Tema${i}_apunts.pdf"
                echo "✅ Copiat apunts: public/$curs/Tema${i}_apunts.pdf"
              fi
              
              if [ -f "$curs/Tema$i/exercicis.pdf" ]; then
                cp "$curs/Tema$i/exercicis.pdf" "public/$curs/Tema${i}_exercicis.pdf"
                echo "✅ Copiat exercicis: public/$curs/Tema${i}_exercicis.pdf"
              fi
            done
          done
          
          # Copiar l'index.html principal
          cp index.html public/

      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
