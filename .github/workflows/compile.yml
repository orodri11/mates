name: Compilar LaTeX i Publicar Web

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el repositori
        uses: actions/checkout@v4

      - name: Crear directoris public
        run: |
          mkdir -p public/1BATX_MACS public/1BATX_CCTT public/2BATX_MACS public/2BATX_CCTT

      # -----------------------------------------------------------------
      # CREACIÓ DEL PLANTILLA PDF "EN CONSTRUCCIÓ"
      # -----------------------------------------------------------------
      - name: Crear plantilla 'En construcció'
        run: |
          mkdir -p placeholder
          cat << 'EOF' > placeholder/en_construccio.tex
          \documentclass[12pt,a4paper]{article}
          \usepackage[utf8]{utf8}
          \usepackage[catalan]{babel}
          \usepackage{xcolor}
          \usepackage{geometry}
          \geometry{margin=2.5cm}
          \usepackage{lmodern}

          \definecolor{brandblue}{RGB}{2, 132, 199}
          \definecolor{textgrey}{RGB}{100, 116, 139}

          \begin{document}
          \thispagestyle{empty}
          \vspace*{4cm}
          \begin{center}
              {\Huge \bfseries \color{brandblue} 🛠️ Material en construcció}\\[1.5cm]
              {\Large Aquest document estarà disponible pròximament.}\\[0.8cm]
              {\large \color{textgrey} Prof. Oscar Rodriguez --- Matemàtiques de Batxillerat}
          \end{center}
          \end{document}
          EOF

      - name: Compilar plantilla 'En construcció'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: en_construccio.tex
          working_directory: placeholder

      # -----------------------------------------------------------------
      # COMPILACIÓ DELS TEMES EXISTENTS
      # -----------------------------------------------------------------
      # 1r BATX MACS
      - name: Compilar 1BATX_MACS Tema 1 Apunts
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: main.tex
          working_directory: 1BATX_MACS/Tema1
      - name: Compilar 1BATX_MACS Tema 1 Exercicis
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: exercicis.tex
          working_directory: 1BATX_MACS/Tema1

      - name: Compilar 1BATX_MACS Tema 2 Apunts
