name: Compilar LaTeX i Publicar Web

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el repositori
        uses: actions/checkout@v4

      - name: Crear directoris public
