name: Compilar LaTeX i Publicar Web

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el repositori
        uses: actions/checkout@v4

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: 1BATX_MACS/Tema1_Números Reals/main.tex

      - name: Organitzar PDF i Web
        run: |
          mkdir -p public/1BATX_MACS public/2BATX_CCTT
          cp "1BATX_MACS/Tema1_Números Reals/main.pdf" public/1BATX_MACS/Tema1.pdf 2>/dev/null || true
          cp index.html public/ 2>/dev/null || true

      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
