name: Compilar LaTeX i Publicar Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el repositori
        uses: actions/checkout@v4

      - name: Instal·lar LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-lang-spanish \
            texlive-science \
            texlive-pictures

      - name: Compilar tots els .tex (2 passades)
        run: |
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            [ -d "$curs" ] || continue
            for tema_dir in "$curs"/Tema*; do
              [ -d "$tema_dir" ] || continue
              for tex in "$tema_dir"/*.tex; do
                [ -f "$tex" ] || continue
                echo "Compilant $tex"
                pdflatex -interaction=nonstopmode -output-directory="$tema_dir" "$tex" || true
                pdflatex -interaction=nonstopmode -output-directory="$tema_dir" "$tex" || true
              done
            done
          done

      - name: Organitzar PDFs a public/
        run: |
          mkdir -p public

          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            [ -d "$curs" ] || continue
            mkdir -p "public/$curs"

            cp "$curs"/*.pdf "public/$curs/" 2>/dev/null || true

            for tema_dir in "$curs"/Tema*; do
              [ -d "$tema_dir" ] || continue
              tema_num=$(basename "$tema_dir" | sed 's/Tema//')

              if [ -f "$tema_dir/main.pdf" ]; then
                cp "$tema_dir/main.pdf" "public/$curs/Tema${tema_num}_apunts.pdf"
              fi

              if [ -f "$tema_dir/exercicis.pdf" ]; then
                cp "$tema_dir/exercicis.pdf" "public/$curs/Tema${tema_num}_exercicis.pdf"
              fi

              if [ -f "$tema_dir/solucions.pdf" ]; then
                cp "$tema_dir/solucions.pdf" "public/$curs/Tema${tema_num}_solucions.pdf"
              fi

              for f in "$tema_dir"/ex*.pdf "$tema_dir"/sol*.pdf; do
                [ -f "$f" ] || continue
                fname=$(basename "$f")
                cp "$f" "public/$curs/Tema${tema_num}_${fname}"
              done
            done
          done

      - name: Generar files.json
        run: |
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            [ -d "public/$curs" ] || continue
            cd "public/$curs"
            files=$(ls *.pdf 2>/dev/null | sed 's/.*/"&"/' | paste -sd ',' -)
            echo "[$files]" > files.json
            echo "Generat $curs/files.json"
            cd - > /dev/null
          done

      - name: Copiar index.html
        run: |
          cp index.html public/ 2>/dev/null || echo "Avis: no hi ha index.html a l'arrel"

      - name: Pujar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
