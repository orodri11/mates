      # ==================== ORGANITZAR TOTS ELS PDF ====================
      - name: Copiar PDFs Generats i Web
        run: |
          for i in {1..10}; do
            cp 1BATX_MACS/Tema$i/main.pdf public/1BATX_MACS/Tema$i.pdf 2>/dev/null || true
            cp 1BATX_CCTT/Tema$i/main.pdf public/1BATX_CCTT/Tema$i.pdf 2>/dev/null || true
            cp 2BATX_MACS/Tema$i/main.pdf public/2BATX_MACS/Tema$i.pdf 2>/dev/null || true
            cp 2BATX_CCTT/Tema$i/main.pdf public/2BATX_CCTT/Tema$i.pdf 2>/dev/null || true
          done
          cp index.html public/

      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4