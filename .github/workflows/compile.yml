name: Compilar LaTeX i Publicar Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el repositori
        uses: actions/checkout@v4

      - name: Instal·lar LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-lang-spanish \
            texlive-science \
            texlive-pictures

      - name: Compilar tots els .tex (2 passades)
        run: |
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            [ -d "$curs" ] || continue
            for tema_dir in "$curs"/*/; do
              tema_dir="${tema_dir%/}"
              [ -d "$tema_dir" ] || continue
              for tex in "$tema_dir"/*.tex; do
                [ -f "$tex" ] || continue
                echo "Compilant $tex"
                pdflatex -interaction=nonstopmode -output-directory="$tema_dir" "$tex" || true
                pdflatex -interaction=nonstopmode -output-directory="$tema_dir" "$tex" || true
              done
            done
          done

      - name: Organitzar PDFs a public/
        run: |
          shopt -s nullglob

          mkdir -p public

          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            [ -d "$curs" ] || continue
            mkdir -p "public/$curs"

            cp "$curs"/*.pdf "public/$curs/" 2>/dev/null || true

            for tema_dir in "$curs"/*/; do
              tema_dir="${tema_dir%/}"
              [ -d "$tema_dir" ] || continue
              prefix=$(basename "$tema_dir")

              for f in "$tema_dir"/*.pdf; do
                [ -f "$f" ] || continue
                fname=$(basename "$f" .pdf)
                fname_lower=$(echo "$fname" | tr '[:upper:]' '[:lower:]')

                case "$fname_lower" in
                  main|apunts)
                    cp "$f" "public/$curs/${prefix}_apunts.pdf"
                    ;;
                  exercicis)
                    cp "$f" "public/$curs/${prefix}_exercicis.pdf"
                    ;;
                  solucions)
                    cp "$f" "public/$curs/${prefix}_solucions.pdf"
                    ;;
                  *)
                    cp "$f" "public/$curs/${prefix}_${fname_lower}.pdf"
                    ;;
                esac
              done
            done
          done

      - name: Generar files.json
        run: |
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            [ -d "public/$curs" ] || continue
            cd "public/$curs"
            files=$(ls *.pdf 2>/dev/null | sed 's/.*/"&"/' | paste -sd ',' -)
            if [ -z "$files" ]; then
              echo "[]" > files.json
            else
              echo "[$files]" > files.json
            fi
            echo "Generat $curs/files.json"
            cd - > /dev/null
          done

      - name: Copiar index.html
        run: |
          cp index.html public/ 2>/dev/null || echo "Avis: no hi ha index.html a l'arrel"

      - name: Pujar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
