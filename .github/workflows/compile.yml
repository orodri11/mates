      - name: Compilar 2BATX_CCTT Tema 8 Apunts
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: main.tex
          working_directory: 2BATX_CCTT/Tema8
      - name: Compilar 2BATX_CCTT Tema 8 Exercicis
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: exercicis.tex
          working_directory: 2BATX_CCTT/Tema8

      # -----------------------------------------------------------------
      # PUBLICACIÓ I PLACEMENT DE PLACEHOLDERS PER ELS FALTANTS
      # -----------------------------------------------------------------
      - name: Organitzar PDFs i Assignar 'En construcció' si falta el PDF
        run: |
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT; do
            for i in {1..10}; do
              # Apunts
              if [ -f "$curs/Tema$i/main.pdf" ]; then
                cp "$curs/Tema$i/main.pdf" "public/$curs/Tema${i}_apunts.pdf"
              else
                cp "placeholder/en_construccio.pdf" "public/$curs/Tema${i}_apunts.pdf"
              fi
              
              # Exercicis
              if [ -f "$curs/Tema$i/exercicis.pdf" ]; then
                cp "$curs/Tema$i/exercicis.pdf" "public/$curs/Tema${i}_exercicis.pdf"
              else
                cp "placeholder/en_construccio.pdf" "public/$curs/Tema${i}_exercicis.pdf"
              fi
            done
          done
          cp index.html public/

      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
