name: Compilar LaTeX i Publicar Web

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el repositori
        uses: actions/checkout@v4

      - name: Crear directoris public
        run: |
          mkdir -p public/1BATX_MACS public/1BATX_CCTT public/2BATX_MACS public/2BATX_CCTT

      # ==================== COMPILACIÓ DINÀMICA ====================
      - name: Compilar tots els fitxers .tex dels temes
        run: |
          sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk
          
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT; do
            for i in {1..10}; do
              dir="$curs/Tema$i"
              if [ -d "$dir" ]; then
                cd "$dir"
                # Compilar main.tex o apunts.tex com a TemaX_apunts.pdf
                if [ -f "apunts.tex" ]; then
                  pdflatex -interaction=nonstopmode apunts.tex || true
                  cp apunts.pdf "../../public/$curs/Tema${i}_apunts.pdf" 2>/dev/null || true
                elif [ -f "main.tex" ]; then
                  pdflatex -interaction=nonstopmode main.tex || true
                  cp main.pdf "../../public/$curs/Tema${i}_apunts.pdf" 2>/dev/null || true
                fi
                
                # Compilar exercicis.tex com a TemaX_exercicis.pdf
                if [ -f "exercicis.tex" ]; then
                  pdflatex -interaction=nonstopmode exercicis.tex || true
                  cp exercicis.pdf "../../public/$curs/Tema${i}_exercicis.pdf" 2>/dev/null || true
                fi
                
                cd - > /dev/null
              fi
            done
          done

      - name: Copiar fitxers de la web
        run: cp index.html public/

      - name: Preparar artefacte
        uses: uses/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4