      # -----------------------------------------------------------------
      # CREAR PAGINA HTML "EN CONSTRUCCIÓ" I ORGANITZAR PDFS
      # -----------------------------------------------------------------
      - name: Organitzar PDFs i Assignar fallback si falta el fitxer
        run: |
          # Crear una pàgina d'avís elegant en HTML quan un PDF no existeix
          cat << 'EOF' > public/en_construccio.html
          <!DOCTYPE html>
          <html lang="ca">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Material en construcció</title>
              <style>
                  body { font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f6f9; color: #1f2937; text-align: center; }
                  .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 450px; }
                  h1 { color: #0284c7; margin-top: 0; }
                  p { color: #64748b; font-size: 1.1em; }
                  .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #0284c7; color: white; border-radius: 8px; text-decoration: none; font-weight: bold; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>🛠️ Material en construcció</h1>
                  <p>Aquest document encara no s'ha publicat. Estarà disponible molt aviat!</p>
                  <a href="javascript:history.back()" class="btn">⬅ Tornar enrere</a>
              </div>
          </body>
          </html>
          EOF

          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT; do
            for i in {1..10}; do
              # Apunts
              if [ -f "$curs/Tema$i/main.pdf" ]; then
                cp "$curs/Tema$i/main.pdf" "public/$curs/Tema${i}_apunts.pdf"
              fi
              
              # Exercicis
              if [ -f "$curs/Tema$i/exercicis.pdf" ]; then
                cp "$curs/Tema$i/exercicis.pdf" "public/$curs/Tema${i}_exercicis.pdf"
              fi
            done
          done
          cp index.html public/

      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
