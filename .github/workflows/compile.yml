name: Compilar LaTeX i Publicar Web

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el repositori
        uses: actions/checkout@v4

      - name: Crear directoris public
        run: |
          mkdir -p public/1BATX_MACS public/1BATX_CCTT public/2BATX_MACS public/2BATX_CCTT public/PAU public/PAP

      # COMPILACIÓ DE TOTS ELS FITXERS .TEX
      - name: Compilar TOTS els fitxers .tex
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-lang-spanish texlive-fonts-recommended

          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            for i in {0..10}; do
              dir="$curs/Tema$i"
              if [ -d "$dir" ]; then
                for tex_file in "$dir"/*.tex; do
                  if [ -f "$tex_file" ]; then
                    echo "⚙️ Compilant $tex_file..."
                    pdflatex -interaction=nonstopmode -output-directory="$dir" "$tex_file" || true
                  fi
                done
              fi
            done
          done

      # ORGANITZAR PDFs I GENERAR EL MANIFEST JSON
      - name: Organitzar PDFs i crear manifest de fitxers
        run: |
          for curs in 1BATX_MACS 1BATX_CCTT 2BATX_MACS 2BATX_CCTT PAU PAP; do
            # Copiar PDFs que es pugin directament a l'arrel del curs
            cp $curs/*.pdf public/$curs/ 2>/dev/null || true

            for i in {0..10}; do
              dir="$curs/Tema$i"
              if [ -d "$dir" ]; then
                # 1. Copiar Apunts principals
                [ -f "$dir/main.pdf" ] && cp "$dir/main.pdf" "public/$curs/Tema${i}_apunts.pdf"
                [ -f "$dir/apunts.pdf" ] && cp "$dir/apunts.pdf" "public/$curs/Tema${i}_apunts.pdf"
                
                # 2. Copiar Exercicis / Solucions generals
                [ -f "$dir/exercicis.pdf" ] && cp "$dir/exercicis.pdf" "public/$curs/Tema${i}_exercicis.pdf"
                [ -f "$dir/solucions.pdf" ] && cp "$dir/solucions.pdf" "public/$curs/Tema${i}_solucions.pdf"

                # 3. Copiar qualsevol ex*.pdf o sol*.pdf amb títols personalitzats
                for f in "$dir"/ex*.pdf "$dir"/sol*.pdf; do
                  if [ -f "$f" ]; then
                    fname=$(basename "$f")
                    cp "$f" "public/$curs/Tema${i}_${fname}"
                  fi
                done
              fi
            done

            # Generar el JSON directament amb Bash (sense dependre de scripts externs)
            cd public/$curs
            list=""
            for f in *.pdf; do
              if [ -f "$f" ]; then
                list="$list\"$f\","
              fi
            done
            # Treure l'última coma i tancar l'array JSON
            list=${list%,}
            echo "[$list]" > files.json
            cd ../..
          done
          
          # Copiar el fitxer principal de la web
          cp index.html public/

      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
