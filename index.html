  // =================================================================
  async function obrirRecurs(event, rutaPDF) {
    // Evitem que l'enllaç s'obri directament
    event.preventDefault();

    try {
      // Fem una petició ràpida (HEAD) per veure si el fitxer existeix
      const resposta = await fetch(rutaPDF, { method: 'HEAD' });

      if (resposta.ok) {
        // Si el fitxer existeix (codi 200), l'obrim en una pestanya nova
        window.open(rutaPDF, '_blank', 'noopener,noreferrer');
      } else {
        // Si no existeix (codi 404), anem a la pàgina d'en construcció
        window.location.href = 'en_construccio.html';
      }
    } catch (error) {
      // Si hi ha cap error de xarxa, enviem a en construcció
      window.location.href = 'en_construccio.html';

  // =================================================================
  // 4. NAVEGACIÓ I RENDERITZAT (SPA)
  // =================================================================
  let nivellSeleccionat = null;
  let cursSeleccionat = null;

  const appContainer = document.getElementById('app');
  const navBar = document.getElementById('navBar');
  const breadcrumb = document.getElementById('breadcrumb');

  function mostrarNivells() {
    nivellSeleccionat = null;
    cursSeleccionat = null;
    navBar.classList.add('hidden');

    let html = `<div class="cards-grid">`;
    estructuraWeb.forEach(n => {
      html += `
        <div class="nav-card" onclick="seleccionarNivell('${n.idNivell}')">
          <div class="nav-card-icon">${n.icona}</div>
          <div class="nav-card-title">${n.titolNivell}</div>
          <div class="nav-card-desc">${n.desc}</div>
        </div>
      `;
    });
    html += `</div>`;

    appContainer.innerHTML = html;
  }

  function seleccionarNivell(idNivell) {
    nivellSeleccionat = estructuraWeb.find(n => n.idNivell === idNivell);
    cursSeleccionat = null;

    navBar.classList.remove('hidden');
    breadcrumb.innerText = nivellSeleccionat.titolNivell;

    let html = '';
    nivellSeleccionat.subseccions.forEach(sub => {
      if (sub.titolSubseccio) {
        html += `<div class="section-header">${sub.titolSubseccio}</div>`;
      }
      html += `<div class="cards-grid">`;
      sub.cursos.forEach(curs => {
        html += `
          <div class="nav-card" onclick="seleccionarCurs('${curs.id}')">
            <div class="nav-card-title">${curs.nom}</div>
            <div class="nav-card-desc">${curs.temes.length} temes disponibles</div>
          </div>
        `;
      });
      html += `</div>`;
    });

    appContainer.innerHTML = html;
  }

  function seleccionarCurs(idCurs) {
    let trobat = null;
    nivellSeleccionat.subseccions.forEach(sub => {
      const c = sub.cursos.find(item => item.id === idCurs);
      if (c) trobat = c;
    });

    cursSeleccionat = trobat;
    breadcrumb.innerText = `${nivellSeleccionat.titolNivell} > ${cursSeleccionat.nom}`;

    let html = `<div class="topics-list">`;

    cursSeleccionat.temes.forEach((nomTema, idx) => {
      const numTema = idx + 1;
      html += `
        <div class="topic-card">
          <span class="topic-title">${nomTema}</span>
          <div class="buttons-group">
      `;

      botonsPerTema.forEach(boto => {
        const rutaPDF = `${cursSeleccionat.id}/Tema${numTema}_${boto.sufix}.pdf`;
        html += `
          <a class="btn-link ${boto.classe}" 
             href="${rutaPDF}" 
             onclick="obrirRecurs(event, '${rutaPDF}')">
            ${boto.etiqueta}
          </a>
        `;
      });

      html += `
          </div>
        </div>
      `;
    });

    html += `</div>`;
    appContainer.innerHTML = html;
  }

  function tornarEnrere() {
    if (cursSeleccionat) {
      seleccionarNivell(nivellSeleccionat.idNivell);
    } else if (nivellSeleccionat) {
      mostrarNivells();
    }
  }

  // Inicialitzar la pàgina
  mostrarNivells();
</script>
